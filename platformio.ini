;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = mks_dlc32_v2_1

; ---------------------------------------------------------------
; MKS DLC32 v2.1 — uses ESP32-WROOM-32. Steppers are NOT wired
; directly to GPIOs: STEP/DIR/EN are pushed through a 74HC595
; shift register driven over the I2S pins (verified against the
; official MKS firmware and FluidNC config):
;   BCK   = GPIO16   (SPI SCK)
;   DATA  = GPIO21   (SPI MOSI)
;   WS    = GPIO17   (SPI SS / 74HC595 LATCH)
; 74HC595 bit map: Q0=disable(active HIGH),
;   Q1/Q2 = X step/dir, Q5/Q6 = Y step/dir, Q3/Q4 = Z step/dir.
; A custom driver in src/stepper595.h handles this via HSPI.
; ---------------------------------------------------------------
[env:mks_dlc32_v2_1]
platform = espressif32
board = esp32dev
board_build.partitions = huge_app.csv
framework = arduino
monitor_speed = 115200
lib_deps =
	bblanchon/ArduinoJson@^6.17.2
	marvinroger/AsyncMqttClient@^0.9.0
	tzapu/WiFiManager@^2.0.17
	esp32async/ESPAsyncWebServer@^3.6.0
	esp32async/AsyncTCP@^3.4.0
	h2zero/NimBLE-Arduino@^1.4.1
