; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = mks_dlc32_v2_1

; ---------------------------------------------------------------
; MKS DLC32 v2.1 — uses ESP32-WROOM-32. Steppers are NOT wired
; directly to GPIOs: STEP/DIR/EN are pushed through a 74HC595
; shift register driven over SPI/I2S pins:
;   DATA  = GPIO27   (MOSI)
;   BCK   = GPIO26   (SCK)
;   WS    = GPIO25   (LATCH / SS)
; A custom driver in src/stepper595.h handles this.
; ---------------------------------------------------------------
[env:mks_dlc32_v2_1]
platform = espressif32
board = esp32dev
board_build.partitions = huge_app.csv
framework = arduino
monitor_speed = 115200
lib_deps =
	bblanchon/ArduinoJson@^6.17.2
	marvinroger/AsyncMqttClient@^0.9.0
	tzapu/WiFiManager@^2.0.17
	esp32async/ESPAsyncWebServer@^3.6.0
	esp32async/AsyncTCP@^3.4.0
	h2zero/NimBLE-Arduino@^1.4.1
